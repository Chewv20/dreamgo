# Virtual Host de referencia para desarrollo local en XAMPP.
# Copia este bloque dentro de C:\xampp\apache\conf\extra\httpd-vhosts.conf
# y reinicia Apache desde el XAMPP Control Panel.
#
# Tambien agrega esta linea a C:\Windows\System32\drivers\etc\hosts (como administrador):
#   127.0.0.1       dreamgo.local

<VirtualHost *:80>
    ServerName dreamgo.local
    DocumentRoot "C:/xampp/htdocs/dreamgo/public"
    <Directory "C:/xampp/htdocs/dreamgo/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/dreamgo.local-error.log"
    CustomLog "logs/dreamgo.local-access.log" common
</VirtualHost>
